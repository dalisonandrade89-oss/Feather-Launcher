name: Build Android APK

on:
  push:
    branches: [ "main", "master", "principal" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: "8.9"

    - name: Build Debug APK with Gradle
      run: gradle assembleDebug

    # FIX #1 (comparação de fluidez): o build de debug (sem minify, com
    # debuggable=true) é bem mais lento que uma build otimizada. Para medir
    # a fluidez real do launcher, compare o app-release gerado aqui, não o
    # app-debug — o debug serve só para desenvolvimento/depuração.
    - name: Build Release APK with Gradle
      run: gradle assembleRelease

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: "**/build/outputs/apk/release/*.apk"
