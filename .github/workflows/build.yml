name: Build Android APK

on:
  push:
    branches: [ "main", "master", "principal" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: "8.9"

    - name: Build Debug APK with Gradle
      run: gradle assembleDebug

    # FIX #20 (segurança, item #6 da auditoria): a keystore de release
    # NUNCA fica no repositório. Ela vem de um secret do GitHub
    # (RELEASE_KEYSTORE_BASE64, configurado em Settings > Secrets and
    # variables > Actions), decodificado aqui num arquivo temporário que
    # só existe durante esta execução do workflow — nunca é commitado
    # nem aparece nos logs. Veja RELEASING.md para gerar a chave e
    # configurar os secrets.
    #
    # Se os secrets não estiverem configurados (ex.: um fork do
    # repositório, ou antes de você configurá-los), RELEASE_STORE_FILE
    # fica vazio e o build.gradle.kts cai de volta para a chave de
    # debug automaticamente — o build não quebra, só não fica assinado
    # com a chave de release de verdade.
    - name: Decode release keystore (se configurado)
      if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

    - name: Build Release APK with Gradle
      env:
        RELEASE_STORE_FILE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && format('{0}/release.keystore', runner.temp) || '' }}
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: gradle assembleRelease

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: "**/build/outputs/apk/release/*.apk"
